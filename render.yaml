services:
  # FastAPI Backend Service
  - type: web
    name: campusshare-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # SECRET_KEY, DATABASE_URL, ALGORITHM set in Render Dashboard — do NOT override here
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: ALLOWED_ORIGINS
        value: https://campus-share-kuet-43qd.vercel.app,https://campus-share-kuet.vercel.app,http://localhost:5173,http://localhost:3000
