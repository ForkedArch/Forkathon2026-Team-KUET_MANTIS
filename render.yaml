services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: campusshare-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: ALLOWED_ORIGINS
        value: https://*.onrender.com,https://*.vercel.app,http://localhost:5173,http://localhost:3000

  # 2. React Frontend Static Site (100% Free on Render - No credit card required!)
  - type: web
    name: campusshare-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://forkathon2026-team-kuet-mantis-2.onrender.com/api
